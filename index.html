<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swasthya Care - Health Package Menu & Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 selection:bg-teal-200 flex flex-col" x-data="swasthyaApp()">
    
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-0 right-0 w-1/3 h-1/3 bg-teal-100 rounded-bl-full opacity-50 blur-3xl mix-blend-multiply"></div>
        <div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-yellow-100 rounded-tr-full opacity-40 blur-3xl mix-blend-multiply"></div>
    </div>

    <div class="relative z-10 flex-grow flex flex-col">
        
        <header class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center cursor-pointer transition-transform hover:scale-105" @click="view = 'menu'; window.scrollTo({ top: 0, behavior: 'smooth' });">
                    <img src="https://cdn1.healthians.com/img/healthians-logo.svg" alt="Healthians Logo" class="h-10 md:h-12 object-contain">
                </div>
                <div class="flex items-center">
                    <span class="text-[10px] md:text-xs font-extrabold text-slate-500 uppercase tracking-wider mr-3 hidden sm:inline-block">Accredited By</span>
                    <div class="flex items-center space-x-2 md:space-x-3">
                        <img src="https://cdn1.healthians.com/img/lab_images/nabl.jpg" alt="NABL Accredited" class="h-10 md:h-14 w-auto object-contain drop-shadow-sm bg-white p-1 rounded border border-slate-200">
                        <img src="https://helma-mumbai.healthians.com/stationery/mailer-assets/68fb2c63f2840.png" alt="CAP Accredited" class="h-10 md:h-14 w-auto object-contain drop-shadow-sm bg-white p-1 rounded border border-slate-200">
                    </div>
                </div>
            </div>
        </header>

        <template x-if="view === 'menu' && cart.length > 0">
            <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40">
                <button @click="view = 'checkout'; window.scrollTo({ top: 0, behavior: 'smooth' });" class="flex items-center space-x-3 bg-teal-900 text-white px-6 py-3 rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.3)] border-2 border-yellow-400 hover:bg-teal-800 hover:scale-105 transition-all">
                    <div class="relative flex items-center justify-center">
                        <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span class="absolute -top-3 -right-3 bg-yellow-400 text-teal-950 text-[10px] font-extrabold rounded-full w-5 h-5 flex items-center justify-center border-2 border-teal-900" x-text="cart.length"></span>
                    </div>
                    <span class="font-bold text-sm tracking-wide">Proceed to Checkout</span>
                </button>
            </div>
        </template>

        <template x-if="view === 'menu'">
            <div class="max-w-7xl mx-auto px-4 py-10 sm:px-6 lg:px-8">
                
                <!-- Hero Heading & Search -->
                <div class="text-center mb-12">
                    <div class="flex justify-center mb-4 cursor-pointer" @click="adminClicks++; if(adminClicks === 3) { adminModalOpen = true; adminPasswordInput = ''; adminAuthError = false; adminClicks = 0; }">
                        <img src="https://i.ibb.co/T5w8drb/tmp-6c91eb22-fc8e-420d-beee-e9d1f6dd2b09.png" alt="Swasthya Care" class="h-40 sm:h-48 md:h-56 lg:h-64 object-contain drop-shadow-sm select-none">
                        onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
        
        <!-- CSS/Text Fallback (Hidden by default, styled to resemble the logo) -->
        <div class="hidden flex flex-col items-center justify-center p-6 border border-slate-100 rounded-2xl bg-white shadow-sm max-w-md mx-auto select-none">
            <!-- Icon/Visual Row Simulation -->
            <div class="flex items-end justify-center space-x-6 mb-4">
                <!-- Patient Icon Indicator -->
                <div class="text-slate-400 text-2xl font-bold animate-pulse">👤</div>
                <!-- Lab/Test Indicator -->
                <div class="px-2 py-1 bg-teal-50 border border-teal-200 rounded text-[10px] font-semibold text-teal-700 tracking-wider uppercase">
                    Diagnostic Tests
                </div>
                <!-- Healthy Restored Person Indicator -->
                <div class="text-emerald-500 text-3xl font-bold">✨🙌</div>
            </div>

            <!-- Brand Typography -->
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight flex items-center">
                <span class="text-[#0B3C5D]">Swasthya</span>
                <span class="text-[#2B9348] ml-2">Care</span>
            </h1>
            
            <!-- Slogan -->
            <p class="text-[11px] sm:text-xs font-bold tracking-widest text-[#0B3C5D] uppercase mt-2 opacity-90">
                Test Today. A Healthier Tomorrow.
            </p>
            
            <!-- Core Values Divider Row -->
            <div class="flex items-center space-x-3 text-[10px] text-slate-400 tracking-widest uppercase mt-3 pt-2 border-t border-slate-100 w-full justify-center">
                <span>Accurate</span>
                <span class="text-slate-300">|</span>
                <span>Reliable</span>
                <span class="text-slate-300">|</span>
                <span>Caring</span>
                    </div>
                    <p class="text-lg md:text-xl text-slate-600 max-w-2xl mx-auto font-medium mt-6">
                        Invest in your well-being with our comprehensive, AI-curated health checkup plans.
                    </p>
                    <div class="mt-8 max-w-xl mx-auto relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" x-model="testSearchQuery" placeholder="Search blood test (e.g. Lipid, Thyroid, CBC, Glucose, ESR)..." class="w-full pl-11 pr-4 py-3 bg-white border border-teal-200 rounded-full shadow-sm focus:ring-2 focus:ring-teal-500 outline-none text-slate-700 font-medium">
                        <template x-if="testSearchQuery">
                            <button @click="testSearchQuery = ''" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 font-bold">Clear</button>
                        </template>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <div class="mb-10 flex flex-wrap items-center justify-center gap-3">
                    <button @click="activeCategoryTab = 'all'" :class="activeCategoryTab === 'all' ? 'bg-teal-900 text-yellow-400 border-2 border-yellow-400 shadow-md scale-105' : 'bg-white text-slate-700 border border-slate-200 hover:bg-teal-50'" class="px-5 py-3 rounded-2xl font-bold text-sm transition-all shadow-sm">🔬 All Lab Tests</button>
                    <button @click="activeCategoryTab = 'atoms'" :class="activeCategoryTab === 'atoms' ? 'bg-teal-900 text-yellow-400 border-2 border-yellow-400 shadow-md scale-105' : 'bg-white text-slate-700 border border-slate-200 hover:bg-teal-50'" class="px-5 py-3 rounded-2xl font-bold text-sm transition-all shadow-sm">🧬 Lab Atoms</button>
                    <button @click="activeCategoryTab = 'health'" :class="activeCategoryTab === 'health' ? 'bg-teal-900 text-yellow-400 border-2 border-yellow-400 shadow-md scale-105' : 'bg-white text-slate-700 border border-slate-200 hover:bg-teal-50'" class="px-5 py-3 rounded-2xl font-bold text-sm transition-all shadow-sm">❤️ Organ Health</button>
                    <button @click="activeCategoryTab = 'bundles'" :class="activeCategoryTab === 'bundles' ? 'bg-teal-900 text-yellow-400 border-2 border-yellow-400 shadow-md scale-105' : 'bg-white text-slate-700 border border-slate-200 hover:bg-teal-50'" class="px-5 py-3 rounded-2xl font-bold text-sm transition-all shadow-sm">🧍 Wellness Bundles</button>
                </div>

                <!-- Packages Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                    <template x-for="pkg in filteredPackages" :key="pkg.id">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full overflow-hidden group hover:shadow-xl hover:border-teal-300 relative transition-all">
                            
                            <div class="relative h-40 overflow-hidden bg-slate-100">
                                <img :src="pkg.image" :alt="pkg.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-3 right-3 flex flex-col items-end gap-1">
                                    <template x-if="pkg.gender !== 'All'">
                                        <span class="text-[10px] uppercase font-extrabold px-2.5 py-1 rounded-full shadow" :class="pkg.gender === 'Female' ? 'bg-pink-600 text-white' : 'bg-blue-600 text-white'" x-text="pkg.gender + ' Only'"></span>
                                    </template>
                                </div>
                                <div class="absolute bottom-3 left-3 bg-white/95 backdrop-blur-sm px-2.5 py-1 rounded-lg text-xs font-bold text-teal-900 shadow" x-text="getTestCount(pkg) + ' Tests'"></div>
                                <button @click="selectedPackageModal = pkg" class="absolute bottom-3 right-3 bg-teal-900/95 hover:bg-teal-950 backdrop-blur-sm px-2.5 py-1 rounded-lg text-xs font-bold text-yellow-400 shadow transition-transform hover:scale-105 cursor-pointer flex items-center space-x-1">
                                    <span x-text="getParamCount(pkg) + ' Parameters'"></span>
                                    <svg class="w-3 h-3 ml-0.5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </button>
                            </div>

                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="text-lg font-bold text-slate-800 leading-tight mb-2" x-text="pkg.name"></h3>
                                <p class="text-xs text-slate-500 mb-4 flex-grow leading-relaxed" x-text="getPackageCategories(pkg)"></p>
                                
                                <template x-if="pkg.dealType === 'Wellness Bundle'">
                                    <div class="mb-4 relative">
                                        <div class="flex items-center space-x-2">
                                            <button type="button" @click="openMemberDropdown = openMemberDropdown === pkg.id ? null : pkg.id" class="flex-1 flex items-center justify-between bg-teal-50/80 hover:bg-teal-100/80 border border-teal-200 text-teal-900 px-3 py-2 rounded-xl text-xs font-bold transition-colors shadow-sm">
                                                <span x-text="getMemberCount(pkg.id) + (getMemberCount(pkg.id) > 1 ? ' Members' : ' Member')"></span>
                                                <svg class="w-4 h-4 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                            </button>
                                            <template x-if="getMemberCount(pkg.id) >= 4">
                                                <div class="flex items-center space-x-1 bg-teal-50 border border-teal-200 p-1 rounded-xl">
                                                    <button type="button" @click="setMembers(pkg.id, Math.max(4, getMemberCount(pkg.id) - 1))" class="bg-white hover:bg-teal-100 text-teal-900 p-1.5 rounded-lg border border-teal-200 text-xs font-bold"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg></button>
                                                    <button type="button" @click="setMembers(pkg.id, Math.min(9, getMemberCount(pkg.id) + 1))" class="bg-teal-900 hover:bg-teal-800 text-yellow-400 p-1.5 rounded-lg text-xs font-bold"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></button>
                                                </div>
                                            </template>
                                        </div>

                                        <template x-if="openMemberDropdown === pkg.id && getMemberCount(pkg.id) <= 4">
                                            <div class="absolute bottom-full mb-2 left-0 right-0 bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 z-30 space-y-1">
                                                <template x-for="num in [1,2,3,4]">
                                                    <div @click="setMembers(pkg.id, num); openMemberDropdown = null;" class="flex items-center justify-between p-2.5 rounded-xl cursor-pointer hover:bg-slate-50" :class="getMemberCount(pkg.id) === num ? 'bg-teal-50 border border-teal-300' : ''">
                                                        <span class="text-xs font-bold text-slate-800" x-text="num + (num > 1 ? ' Members' : ' Member')"></span>
                                                        <span class="text-xs font-extrabold text-teal-800" x-text="'₹' + getPricing(pkg, num).price"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <div class="mt-2 text-center py-1.5 px-2 bg-amber-50 border border-amber-200 rounded-lg text-[11px] font-bold text-amber-800" x-text="getEncouragingBanner(pkg)"></div>
                                    </div>
                                </template>

                                <div class="mt-auto">
                                    <div class="flex items-center space-x-3 mb-4">
                                        <span class="text-sm font-bold text-slate-400 line-through" x-text="'₹' + getPricing(pkg, getMemberCount(pkg.id)).mrp"></span>
                                        <span class="text-2xl font-extrabold text-emerald-700" x-text="'₹' + getPricing(pkg, getMemberCount(pkg.id)).price"></span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <button @click="toggleCart(pkg.id)" class="flex items-center justify-center w-full py-2 text-xs font-bold rounded-lg transition-colors shadow-sm" :class="cart.includes(pkg.id) ? 'bg-teal-700 text-white border border-teal-800' : 'bg-yellow-400 hover:bg-yellow-500 text-teal-950'">
                                            <span x-text="cart.includes(pkg.id) ? 'Added ✓' : 'Add to Cart'"></span>
                                        </button>
                                        <button @click="chatOpen = true; handleAIChat('Tell me more about ' + pkg.name);" class="flex items-center justify-center w-full py-2 text-xs font-bold bg-slate-100 hover:bg-teal-50 text-teal-800 border border-slate-200 rounded-lg transition-colors">
                                            Ask AI
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Award & Trusted Sections -->
                <div class="mt-16 mb-8 bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-8">
                    <div class="w-full md:w-5/12 flex justify-start">
                        <img src="https://cdn3.healthians.com/img/unit-no1.svg" alt="Times Health Excellence Survey 2024" class="w-full max-w-sm object-contain drop-shadow-sm">
                    </div>
                    <div class="w-full md:w-7/12 bg-slate-50 p-6 rounded-2xl border border-slate-200 text-slate-700 text-sm md:text-base font-medium leading-relaxed">
                        With a presence in <strong class="text-teal-900">250+ cities</strong>, Healthians offers quick, affordable, and hassle-free at-home testing services, backed by a trusted network of <strong class="text-teal-900">NABL and CAP</strong> accredited labs.
                    </div>
                </div>

                <div class="mb-12 bg-teal-50 rounded-3xl p-6 md:p-8 border border-teal-200 text-center shadow-sm">
                    <h3 class="text-xl font-extrabold text-teal-950 mb-2">Trusted Diagnostics Nationwide</h3>
                    <p class="text-xs md:text-sm text-teal-800 max-w-2xl mx-auto font-medium">
                        Our advanced laboratories use fully automated analyzers to ensure 99.9% diagnostic accuracy, trusted by over 10 million households across India.
                    </p>
                </div>
            </div>
        </template>

        <template x-if="view === 'checkout'">
            <div class="max-w-4xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
                <button @click="view = 'menu'" class="flex items-center text-teal-700 hover:text-teal-900 font-semibold mb-8">
                    <svg class="w-5 h-5 mr-2 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    Back to Packages
                </button>

                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden">
                    <div class="bg-teal-900 p-6 md:p-8 text-white">
                        <h2 class="text-3xl font-extrabold mb-2 text-yellow-400">Complete Your Booking</h2>
                        <p class="text-teal-100">Assign tests to family members and fill patient & address details.</p>
                    </div>

                    <form @submit.prevent="submitBooking" class="p-6 md:p-8 space-y-8">
                        <!-- Primary Patient Details -->
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center"><svg class="w-5 h-5 mr-2 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> Primary Patient Details & Address</h3>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name (Billing Name) *</label>
                                    <input required type="text" x-model="primaryBooking.name" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="John Doe">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-1">Age *</label>
                                        <input required type="number" min="1" max="120" x-model="primaryBooking.age" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="Years">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-1">Sex *</label>
                                        <select required x-model="primaryBooking.gender" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none">
                                            <option value="">Select</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-1">Email ID *</label>
                                    <input required type="email" x-model="primaryBooking.email" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="email@example.com">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-1">Contact No *</label>
                                    <input required type="tel" x-model="primaryBooking.contact" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="10-digit mobile">
                                </div>

                                <!-- Primary Test Assignment -->
                                <div class="md:col-span-2 bg-teal-50/70 p-4 rounded-xl border border-teal-200 space-y-3">
                                    <label class="block text-xs font-bold text-teal-950 uppercase">Assign Tests for Primary Patient (<span x-text="primaryBooking.name || 'Primary'"></span>):</label>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="id in cart" :key="id">
                                            <button type="button" @click="toggleAssignment('primary', id)" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition-all flex items-center space-x-1.5" :class="isAssigned('primary', id) ? 'bg-teal-900 text-yellow-400 border-teal-900' : 'bg-white text-slate-700 border-slate-200'">
                                                <span x-text="getPackageName(id)"></span>
                                                <template x-if="isAssigned('primary', id)"><svg class="w-3 h-3 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></template>
                                            </button>
                                        </template>
                                    </div>
                                </div>

                                <!-- Address Fields -->
                                <div class="md:col-span-2 border-t border-slate-200 pt-4 mt-2">
                                    <div class="flex flex-col md:flex-row md:items-center justify-between mb-4">
                                        <label class="block text-sm font-bold text-teal-900">Home Address for Sample Collection *</label>
                                        <button type="button" @click="getLocation()" class="text-xs bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-800 font-bold py-1.5 px-3 rounded-lg">Auto-detect My Location</button>
                                    </div>
                                    <template x-if="locationStatus"><p class="text-xs font-bold mb-3" :class="locationStatus.includes('✓') ? 'text-green-600' : 'text-amber-600'" x-text="locationStatus"></p></template>
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label class="block text-xs font-semibold text-slate-700 mb-1">House / Flat / Block No. *</label><input required type="text" x-model="primaryBooking.houseNo" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="Flat 4B"></div>
                                        <div><label class="block text-xs font-semibold text-slate-700 mb-1">Street / Locality *</label><input required type="text" x-model="primaryBooking.street" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="Main Market"></div>
                                        <div><label class="block text-xs font-semibold text-slate-700 mb-1">City *</label><input required type="text" x-model="primaryBooking.city" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="City"></div>
                                        <div class="grid grid-cols-2 gap-4">
                                            <div><label class="block text-xs font-semibold text-slate-700 mb-1">State *</label><input required type="text" x-model="primaryBooking.state" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="State"></div>
                                            <div><label class="block text-xs font-semibold text-slate-700 mb-1">Pincode *</label><input required type="text" x-model="primaryBooking.pincode" class="w-full p-2.5 bg-slate-50 border border-teal-200 rounded-lg outline-none" placeholder="6 digits"></div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Date & Slot -->
                                <div class="md:col-span-2 bg-teal-50/50 p-4 rounded-xl border border-teal-100">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label class="block text-xs font-bold text-teal-900 mb-1">Preferred Collection Date *</label>
                                            <input required type="date" :min="getMinDate()" x-model="primaryBooking.preferredDate" class="w-full p-2.5 bg-white border border-teal-200 rounded-lg outline-none text-sm">
                                        </div>
                                        <div class="text-[11px] text-amber-700 font-medium italic flex items-center">* Must be at least 4 hours ahead.</div>

                getPricing(pkg, count) {
                    const basePrice = pkg.price;
                    const baseMrp = pkg.mrp || Math.round(basePrice * 2.5);
                    if (count === 1) return { price: basePrice, mrp: baseMrp };
                    let total = 0;
                    for (let i = 1; i <= count; i++) {
                        if (i === 1) total += basePrice;
                        else if (i === 2) total += Math.round(basePrice * (1 - 0.1495));
                        else if (i === 3) total += Math.round(basePrice * (1 - 0.0723));

                        }
                    }
                },

                getTestCount(pkg) { return pkg.tests || 5; },
                getParamCount(pkg) { return pkg.parameters || 30; },
                getPackageCategories(pkg) { return pkg.includes; },

                addFamilyMember() {
                    this.familyMembers.push({ id: Date.now() + Math.random(), name: '', age: '', gender: '', email: '' });
                },
                removeFamilyMember(id) {
                    this.familyMembers = this.familyMembers.filter(m => m.id !== id);
                    delete this.patientAssignments[id];
                },

                getRequiredFamilyMembersCount() {
                    let max = 0;
                    this.cart.forEach(id => {
                        const p = this.packages.find(x => x.id === id);
                        if (p && p.dealType === 'Wellness Bundle') {
                            const c = this.getMemberCount(id);
                            if (c - 1 > max) max = c - 1;
                        }
                    });
                    return max;
                },

                get requiredFamilySlots() { return this.getRequiredFamilyMembersCount(); },

                toggleAssignment(patientKey, pkgId) {
                    if (!this.patientAssignments[patientKey]) this.patientAssignments[patientKey] = [];
                    const list = this.patientAssignments[patientKey];
                    if (list.includes(pkgId)) {
                        this.patientAssignments[patientKey] = list.filter(x => x !== pkgId);
                    } else {
                        this.patientAssignments[patientKey].push(pkgId);
                    }
                },

                isAssigned(patientKey, pkgId) {
                    return (this.patientAssignments[patientKey] || []).includes(pkgId);
                },

                getPackageName(id) {
                    const p = this.packages.find(x => x.id === id);
                    return p ? p.name : '';
                },

                calculateTotal() {
                    let sum = 0;
                    this.cart.forEach(id => {
                        const p = this.packages.find(x => x.id === id);
                        if (p) sum += this.getPricing(p, this.getMemberCount(id)).price;
                    });
                    return sum;
                },

                getMinDate() {
                    const now = new Date();
                    if (now.getHours() >= 17) {
                        const tomorrow = new Date(now);
                        tomorrow.setDate(tomorrow.getDate() + 1);
                        return tomorrow.toISOString().split('T')[0];
                    }
                    return now.toISOString().split('T')[0];
                },

                getLocation() {
                    this.locationStatus = 'Detecting location...';
                    if (!navigator.geolocation) { this.locationStatus = 'Geolocation not supported.'; return; }
                    navigator.geolocation.getCurrentPosition(pos => {
                        this.primaryBooking.mapLocation = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        this.locationStatus = 'GPS Location captured ✓';
                    }, () => { this.locationStatus = 'Permission denied.'; });
                },

                handleOtpSubmit() {
                    if (!this.otpSent) {
                        if (this.resetEmail.trim().toLowerCase() === 'admin.swasthyacare@gmail.com') {
                            this.otpSent = true;
                            this.otpMessage = 'OTP sent to admin.swasthyacare@gmail.com (Hint: 1234) ✓';
                        } else {
                            this.otpMessage = 'Use admin.swasthyacare@gmail.com';
                        }
                    } else {
                        if (this.otpInput === '1234' && this.newPasswordInput.length >= 6) {
                            this.adminPassword = this.newPasswordInput;
                            this.showOtpModal = false;
                            this.otpMessage = 'Password updated successfully!';
                        } else {
                            this.otpMessage = 'Invalid OTP or password too short.';
                        }
                    }
                },

                handleAIChat(text) {
                    if (!text.trim()) return;
                    this.messages.push({ role: 'user', text });
                    setTimeout(() => {
                        this.messages.push({ role: 'model', text: 'I recommend our Swasthya Mitra BASIC package for comprehensive diagnostic screening. [ADD:1]' });
                    }, 600);
                },

                copyBookings() {
                    let tsv = "Date\tName\tContact\tSlot\tAmount\n";
                    this.bookings.forEach(b => {
                        tsv += `${new Date(b.timestamp).toLocaleString()}\t${b.primaryBooking.name}\t${b.primaryBooking.contact}\t${b.primaryBooking.preferredDate}\t${b.totalAmount}\n`;
                    });
                    navigator.clipboard.writeText(tsv).then(() => {
                        window.open(this.googleSheetUrl, '_blank');
                    });
                },

                submitBooking() {
                    const booking = {
                        primaryBooking: this.primaryBooking,
                        cart: this.cart,
                        familyMembers: this.familyMembers,
                        patientAssignments: this.patientAssignments,
                        totalAmount: this.calculateTotal(),
                        timestamp: Date.now()
                    };
                    this.bookings.unshift(booking);
                    let wa = `*New Booking from Swasthya Care*\nName: ${this.primaryBooking.name}\nTotal: ₹${booking.totalAmount}`;
                    window.open(`https://wa.me/917665857270?text=${encodeURIComponent(wa)}`, '_blank');
                    this.view = 'success';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
        }
    </script>
</body>
