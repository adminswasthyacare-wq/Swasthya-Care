                  else if (i === 3) totalPrice += Math.round(basePrice * (1 - 0.0723));

                  let text = '';
                  try {
                      const decoderUtf8 = new TextDecoder('utf-8', { fatal: true });
                      text = decoderUtf8.decode(buffer);
                  } catch (err) {
                      const decoderFallback = new TextDecoder('windows-1252');
                      text = decoderFallback.decode(buffer);

                                              </div>

                                              {/* Date & Time Slot */}
                                              <div className="md:col-span-2 bg-teal-50/50 p-4 rounded-xl border border-teal-100">
                                                  <div className="mb-4">
                                                      <label className="block text-xs font-bold text-teal-900 mb-1">Preferred Collection Date *</label>
                                                      <input required type="date" min={getMinBookingDate()} value={primaryBooking.preferredDate} onChange={e => setPrimaryBooking({...primaryBooking, preferredDate: e.target.value})} className="w-full p-2.5 bg-white border border-teal-200 rounded-lg text-sm" />
                                                  </div>
                                                  <label className="block text-xs font-bold text-teal-900 mb-2">Select Time Slot *</label>
                                                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                      {["07:00 AM - 08:00 AM", "08:00 AM - 09:00 AM", "09:00 AM - 10:00 AM", "10:00 AM - 11:00 AM", "11:00 AM - 12:00 PM", "12:00 PM - 13:00 PM", "14:00 PM - 15:00 PM", "16:00 PM - 17:00 PM"].map(slot => (
                                                          <button key={slot} type="button" onClick={() => setPrimaryBooking({...primaryBooking, preferredTime: slot})} className={`py-2 px-3 text-xs font-bold rounded-lg border ${primaryBooking.preferredTime === slot ? 'bg-teal-900 text-yellow-400 border-teal-900' : 'bg-white text-slate-700 border-slate-200'}`}>
                                                              {slot}
                                                          </button>
                                                      ))}
                                                  </div>
                                              </div>
                                          </div>
                                      </div>

                                      {/* Family Members Section */}
                                      <div className="mb-10">
                                          <div className="flex justify-between items-center mb-6">
                                              <h3 className="text-xl font-bold text-slate-800">Additional Family Members</h3>
                                              <button type="button" onClick={addFamilyMember} className="flex items-center text-sm font-bold text-teal-700 bg-teal-50 px-3 py-2 rounded-lg border border-teal-200">
                                                  <Icon name="plus" className="w-4 h-4 mr-1" /> Add Family Member
                                              </button>
                                          </div>

                                          {familyMembers.map((member, index) => (
                                              <div key={member.id} className="relative bg-white border border-teal-100 rounded-xl p-5 shadow-sm space-y-4 mb-4">
                                                  <button type="button" onClick={() => removeFamilyMember(member.id)} className="absolute top-4 right-4 text-red-400 hover:text-red-600">
                                                      <Icon name="trash" className="w-5 h-5" />
                                                  </button>
                                                  <h4 className="font-bold text-teal-800">Family Member {index + 1}</h4>
                                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                      <input required type="text" value={member.name} onChange={e => updateFamilyMember(member.id, 'name', e.target.value)} className="w-full p-2 border border-teal-200 rounded-md text-sm" placeholder="Member Name" />
                                                      <div className="grid grid-cols-2 gap-2">
                                                          <input required type="number" min="1" max="120" value={member.age} onChange={e => updateFamilyMember(member.id, 'age', e.target.value)} className="w-full p-2 border border-teal-200 rounded-md text-sm" placeholder="Age" />
                                                          <select required value={member.gender} onChange={e => updateFamilyMember(member.id, 'gender', e.target.value)} className="w-full p-2 border border-teal-200 rounded-md text-sm">
                                                              <option value="">Sex</option>
                                                              <option value="Male">Male</option>
                                                              <option value="Female">Female</option>
                                                          </select>
                                                      </div>
                                                  </div>
                                              </div>
                                          ))}
                                      </div>

                                      <div className="bg-teal-900 rounded-xl p-6 flex flex-col md:flex-row justify-between items-center text-white">
                                          <div>
                                              <p className="text-teal-200 font-medium">Total Amount Payable</p>
                                              <p className="text-3xl font-extrabold text-yellow-400">₹{calculateTotal()}</p>
                                          </div>
                                          <button type="submit" disabled={cart.length === 0} className="w-full md:w-auto mt-4 md:mt-0 bg-yellow-400 hover:bg-yellow-500 text-teal-950 font-bold text-lg py-3 px-8 rounded-full shadow-lg">
                                              Confirm Booking
                                          </button>
                                      </div>
                                  </form>
                              </div>
                          </div>
                      )}

                      {}
                      {view === 'success' && (
                          <div className="max-w-2xl mx-auto px-4 py-20 text-center animate-in zoom-in duration-500">
                              <div className="inline-flex items-center justify-center w-24 h-24 bg-teal-100 rounded-full mb-8">
                                  <Icon name="check" className="w-12 h-12 text-teal-600" />
                              </div>
                              <h2 className="text-4xl font-extrabold text-teal-950 mb-4">Booking Confirmed!</h2>
                              <p className="text-lg text-slate-600 mb-8">Thank you, <span className="font-bold text-teal-800">{primaryBooking.name}</span>. Your home sample collection has been scheduled.</p>
                              <button onClick={() => { setView('menu'); setCart([]); setFamilyMembers([]); }} className="bg-teal-900 text-white px-8 py-3 rounded-full font-bold hover:bg-teal-800 shadow-md">
                                  Return to Home
                              </button>
                          </div>
                      )}

                      {view === 'admin' && (
                          <div className="max-w-7xl mx-auto px-4 py-12">
                              <div className="flex justify-between items-center mb-8">
                                  <h2 className="text-3xl font-extrabold text-teal-950 flex items-center">
                                      <Icon name="lock" className="w-8 h-8 mr-3 text-teal-700" /> Lab Admin Dashboard
                                  </h2>
                                  <div className="flex items-center space-x-3">
                                      <button onClick={copyBookingsToClipboardForGoogleSheets} className="bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs flex items-center shadow">
                                          <Icon name="copy" className="w-4 h-4 mr-2" /> Copy Data for Google Sheets
                                      </button>
                                      <button onClick={() => setView('menu')} className="bg-slate-200 text-slate-800 px-4 py-2.5 rounded-xl font-bold text-xs">Exit Admin</button>
                                  </div>
                              </div>

                              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8">
                                  <h3 className="text-lg font-extrabold text-teal-950 mb-4">Bulk CSV Test & Pricing Manager</h3>
                                  <textarea rows="3" value={adminCsvInput} onChange={e => setAdminCsvInput(e.target.value)} placeholder="PackageName,DealType,MRP,Price,Gender" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs mb-4" />
                                  <button onClick={() => handleCsvImport(adminCsvInput)} className="px-6 py-2 bg-teal-900 text-yellow-400 rounded-xl font-bold text-xs shadow">Sync Catalog</button>
                                  {adminFeedback && <p className="mt-3 text-xs font-bold text-teal-800">{adminFeedback}</p>}
                              </div>
                          </div>
                      )}
                  </div>

                  {/* Footer */}
                  <footer className="w-full bg-white border-t border-slate-200 mt-auto py-6 px-6 text-center text-xs text-slate-500">
                      © 2026 Swasthya Care Diagnostics. NABL & CAP Accredited Laboratories.
                  </footer>

                  {/* Admin Password Modal */}
                  {adminModalOpen && (
                      <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
                              <h3 className="font-extrabold text-lg mb-4 text-teal-950">Lab Admin Login</h3>
                              <form onSubmit={(e) => {
                                  e.preventDefault();
                                  if (adminPasswordInput === adminPassword) {
                                      setAdminModalOpen(false);
                                      setView('admin');
                                      setAdminAuthError(false);
                                  } else {
                                      setAdminAuthError(true);
                                  }
                              }}>
                                  <input type="password" required value={adminPasswordInput} onChange={e => setAdminPasswordInput(e.target.value)} placeholder="Enter password..." className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl mb-3 text-sm" />
                                  {adminAuthError && <p className="text-xs text-red-600 font-bold mb-3">Incorrect password.</p>}
                                  <div className="flex justify-end space-x-2">
                                      <button type="button" onClick={() => setAdminModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">Cancel</button>
                                      <button type="submit" className="px-5 py-2 bg-teal-900 text-yellow-400 rounded-xl text-xs font-bold">Login</button>
                                  </div>
                              </form>
                          </div>
                      </div>
                  )}

                  {/* Floating AI Chat Assistant */}
                  <div className="fixed bottom-6 right-6 z-50">
                      {!chatOpen && (
                          <button onClick={() => setChatOpen(true)} className="bg-teal-700 text-white p-4 rounded-full shadow-2xl hover:bg-teal-800 transition-transform hover:scale-110 flex items-center justify-center border-2 border-teal-600">
                              <Icon name="message" className="w-7 h-7" />
                          </button>
                      )}
                      {chatOpen && (
                          <div className="bg-white w-80 md:w-96 rounded-2xl shadow-2xl border border-slate-200 flex flex-col h-[500px]">
                              <div className="bg-teal-900 text-white p-4 flex justify-between items-center">
                                  <h3 className="font-bold text-yellow-400">Swasthya AI Assistant</h3>
                                  <button onClick={() => setChatOpen(false)} className="text-teal-200 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                              </div>
                              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                                  {messages.map((msg, idx) => (
                                      <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                          <div className={`max-w-[85%] rounded-2xl p-3 text-sm shadow-sm ${msg.role === 'user' ? 'bg-teal-600 text-white' : 'bg-white border text-slate-700'}`}>
                                              {msg.role === 'user' ? msg.text : renderModelMessage(msg.text)}
                                          </div>
                                      </div>
                                  ))}
                                  {isAILoading && <div className="text-xs text-slate-400 italic">Thinking...</div>}
                                  <div ref={chatEndRef} />
                              </div>
                              <form onSubmit={e => { e.preventDefault(); handleSendMessage(inputValue); }} className="p-3 bg-white border-t flex">
                                  <input type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="Ask about tests or symptoms..." className="flex-1 p-2 bg-slate-50 border rounded-l-xl text-sm outline-none" />
                                  <button type="submit" className="bg-teal-700 text-white px-4 rounded-r-xl font-bold text-sm">Send</button>
                              </form>
                          </div>
                      )}
                  </div>
              </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
