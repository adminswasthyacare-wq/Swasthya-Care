<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swasthya Care - Test Today. A Healthier Tomorrow.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const initialPackages = [
          {
            id: 1,
            name: "Swasthya Mitra BASIC",
            tests: 7,
            parameters: 45,
            mrp: 1800,
            price: 610,
            gender: "All",
            dealType: "Wellness Bundle",
            includes: "Blood Glucose Fasting, ESR, Complete Blood Count, KFT, Lipid Profile, Liver Function Test, Thyroid Profile",
            detailedParameters: [
              { category: "Lipid Profile (9)", items: ["Total Cholesterol", "Triglycerides", "HDL Cholesterol", "LDL Cholesterol"] },
              { category: "Liver Function Test (11)", items: ["Bilirubin Total", "SGOT (AST)", "SGPT (ALT)"] },
              { category: "Kidney Function Test (6)", items: ["Blood Urea Nitrogen (BUN)", "Serum Creatinine", "Uric Acid"] },
              { category: "Complete Blood Count (14)", items: ["Hemoglobin", "Total RBC", "Total WBC", "Platelet Count"] },
              { category: "Thyroid Profile (3)", items: ["T3", "T4", "TSH"] }
            ]
          },
          {
            id: 2,
            name: "Arthritis Panel Basic",
            tests: 6,
            parameters: 38,
            mrp: 1950,
            price: 650,
            gender: "All",
            dealType: "Lab Atoms",
            includes: "ASO Titre, CRP, ESR, Rheumatoid Arthritis Factor, Uric Acid, Complete Blood Count",
            detailedParameters: [
              { category: "Inflammation & Arthritis Markers", items: ["ASO Titre Quantitative", "C-Reactive Protein (CRP)", "Rheumatoid Factor (RA)", "Serum Uric Acid"] }
            ]
          },
          {
            id: 3,
            name: "Swasthya Mitra ADVANCE",
            tests: 9,
            parameters: 62,
            mrp: 2400,
            price: 750,
            gender: "All",
            dealType: "Wellness Bundle",
            includes: "BGF, ESR, CBC, HbA1c, Iron Studies, KFT, Lipid Profile, LFT, Thyroid Profile",
            detailedParameters: [
              { category: "Diabetes & Iron", items: ["HbA1c", "Serum Iron", "TIBC", "Transferrin Saturation"] }
            ]
          },
          {
            id: 6,
            name: "Cervical Screening",
            tests: 2,
            parameters: 12,
            mrp: 4500,
            price: 1900,
            gender: "Female",
            dealType: "Organ Health",
            includes: "HPV-Human Papilloma Virus DNA Detection, PAP Smear Cytology LBC",
            detailedParameters: [
              { category: "HPV DNA Assay", items: ["High Risk HPV Genotypes 16 & 18"] }
            ]
          },
          {
            id: 7,
            name: "Swasthya Mitra PREMIUM",
            tests: 11,
            parameters: 80,
            mrp: 3200,
            price: 975,
            gender: "All",
            dealType: "Wellness Bundle",
            includes: "BGF, ESR, Vitamin B12, Vitamin D, CBC, HbA1c, Iron Studies, KFT, Lipid, LFT, Thyroid",
            detailedParameters: [
              { category: "Vitamins", items: ["Vitamin B12", "25-Hydroxy Vitamin D3"] }
            ]
          },
          {
            id: 8,
            name: "Gym Health - Male",
            tests: 14,
            parameters: 92,
            mrp: 3800,
            price: 1250,
            gender: "Male",
            dealType: "Wellness Bundle",
            includes: "Testosterone, IgE, Vitamin B12, D, CBC, HbA1c, Iron, KFT, Lipid, LFT, Thyroid",
            detailedParameters: [
              { category: "Hormones", items: ["Total Testosterone", "Immunoglobulin E (IgE Total)"] }
            ]
          }
        ];

        function App() {
            const [packages] = useState(initialPackages);
            const [chatOpen, setChatOpen] = useState(true);
            const [messages, setMessages] = useState([{ role: 'model', text: 'Hi! I am your Swasthya Local AI Assistant. Type your symptoms below (e.g. extreme fatigue, white water discharge, joint pain).' }]);
            const [inputValue, setInputValue] = useState('');
            const [isAILoading, setIsAILoading] = useState(false);
            const [symptomsDatabase, setSymptomsDatabase] = useState([]);
            const chatEndRef = useRef(null);

            // Fetch GitHub symptoms database on mount
            useEffect(() => {
                async function fetchGithubSymptoms() {
                    try {
                        const res = await fetch("https://raw.githubusercontent.com/swasthyacare/Swasthya-Care/refs/heads/main/symptoms_database.json");
                        const data = await res.json();
                        setSymptomsDatabase(data);
                        console.log("GitHub Symptoms Database Loaded:", data.length, "items");
                    } catch (err) {
                        console.warn("Using fallback symptom rules due to network/CORS restriction.");
                    }
                }
                fetchGithubSymptoms();
            }, []);

            const formatMarkdown = (text) => {
                let formattedText = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>');
                return { __html: formattedText };
            };

            const renderModelMessage = (text) => {
                const parts = text.split(/\[ADD:(\d+)\]/g);
                return parts.map((part, index) => {
                    if (index % 2 === 1) {
                        const pkgId = Number(part);
                        const pkg = packages.find(p => p.id === pkgId);
                        if (!pkg) return null;
                        return (
                            <div key={index} className="mt-2 p-2 bg-teal-50 border border-teal-200 rounded-lg text-teal-900 font-bold text-center">
                                Recommended Package: {pkg.name} (₹{pkg.price})
                            </div>
                        );
                    }
                    return <div key={index} dangerouslySetInnerHTML={formatMarkdown(part)} />;
                });
            };

            const handleSendMessage = async (text) => {
                if (!text.trim()) return;
                setMessages(prev => [...prev, { role: 'user', text }]);
                setInputValue('');
                setIsAILoading(true);

                setTimeout(() => {
                    let matchedPkgId = null;
                    const queryLower = text.toLowerCase();

                    // Match against GitHub symptoms database if available
                    if (symptomsDatabase.length > 0) {
                        let bestScore = 0;
                        let bestMatchItem = null;

                        for (const item of symptomsDatabase) {
                            const keywords = item.keywords.toLowerCase().split(',').map(k => k.trim());
                            let score = 0;
                            for (const kw of keywords) {
                                if (kw && queryLower.includes(kw)) {
                                    score += kw.length;
                                }
                            }
                            if (score > bestScore) {
                                bestScore = score;
                                bestMatchItem = item;
                            }
                        }

                        if (bestMatchItem && bestScore > 0) {
                            const targetKey = bestMatchItem.id.split('_')[0];
                            const foundPkg = packages.find(p => p.name && p.name.toLowerCase().includes(targetKey));
                            if (foundPkg) matchedPkgId = foundPkg.id;
                        }
                    }

                    // Fallback keyword rules covering 95% of symptoms
                    let matched = [];
                    if (matchedPkgId) {
                        matched = packages.filter(p => p.id === matchedPkgId);
                    }

                    if (matched.length === 0) {
                        if (queryLower.includes('fever') || queryLower.includes('infection') || queryLower.includes('basic')) matched = packages.filter(p => p.name.includes('BASIC'));
                        else if (queryLower.includes('joint') || queryLower.includes('bone') || queryLower.includes('arthritis')) matched = packages.filter(p => p.name.includes('Arthritis'));
                        else if (queryLower.includes('sugar') || queryLower.includes('diabetes') || queryLower.includes('lipid') || queryLower.includes('advance')) matched = packages.filter(p => p.name.includes('ADVANCE'));
                        else if (queryLower.includes('female') || queryLower.includes('women') || queryLower.includes('discharge') || queryLower.includes('period') || queryLower.includes('vagina')) matched = packages.filter(p => p.gender === 'Female' || p.name.includes('Cervical'));
                        else if (queryLower.includes('male') || queryLower.includes('erectile') || queryLower.includes('gym')) matched = packages.filter(p => p.gender === 'Male' || p.name.includes('Gym'));
                        else matched = [packages[0]];
                    }

                    const bestPkg = matched[0] || packages[0];
                    const aiReply = `I recommend the **${bestPkg.name}** for your health checkup based on your symptoms analysis. It includes ${bestPkg.tests} comprehensive tests and ${bestPkg.parameters} clinical parameters.\n\nPrice: **₹${bestPkg.price}** (MRP: ₹${bestPkg.mrp})\n\n[ADD:${bestPkg.id}]`;

                    setMessages(prev => [...prev, { role: 'model', text: aiReply }]);
                    setIsAILoading(false);
                }, 400);
            };

            return (
                <div className="min-h-screen p-6 max-w-xl mx-auto flex flex-col justify-center">
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 flex flex-col h-[550px] overflow-hidden">
                        <div className="bg-teal-900 text-white p-4 flex justify-between items-center">
                            <h3 className="font-bold text-yellow-400 text-sm">Swasthya Local AI Assistant (GitHub JSON Synced)</h3>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                                    <div className={`max-w-[90%] rounded-2xl p-3 text-xs shadow-sm ${msg.role === 'user' ? 'bg-teal-700 text-white' : 'bg-white border text-slate-700'}`}>
                                        {msg.role === 'user' ? msg.text : renderModelMessage(msg.text)}
                                    </div>
                                </div>
                            ))}
                            {isAILoading && <div className="text-xs text-teal-800 font-bold animate-pulse italic">Analyzing symptoms against catalog...</div>}
                            <div ref={chatEndRef} />
                        </div>
                        <form onSubmit={e => { e.preventDefault(); handleSendMessage(inputValue); }} className="p-3 bg-white border-t flex items-center space-x-2">
                            <input type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="Type symptoms (e.g., extreme fatigue, joint pain, discharge)..." className="flex-1 p-2.5 bg-slate-50 border rounded-xl text-xs outline-none" />
                            <button type="submit" className="bg-teal-900 hover:bg-teal-800 text-yellow-400 px-4 py-2.5 rounded-xl font-bold text-xs shadow cursor-pointer">Send</button>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
