                              </form>
                          </div>
                      </div>
                  )}

                  {/* Swasthya AI Assistant Drawer */}
                  <div className="fixed bottom-6 right-6 z-50">
                      {!chatOpen && (
                          <button onClick={() => setChatOpen(true)} className="bg-teal-700 text-white p-4 rounded-full shadow-2xl hover:bg-teal-800 transition-transform hover:scale-110 flex items-center justify-center border-2 border-teal-600 cursor-pointer">
                              <Icon name="message" className="w-7 h-7" />
                          </button>
                      )}
                      {chatOpen && (
                          <div className="bg-white w-80 md:w-96 rounded-2xl shadow-2xl border border-slate-200 flex flex-col h-[500px]">
                              <div className="bg-teal-900 text-white p-4 flex justify-between items-center rounded-t-2xl">
                                  <div className="flex items-center space-x-2">
                                      <img 
                                    src="https://raw.githubusercontent.com/swasthyacare/Swasthya-Care/refs/heads/main/Swasthya%20Care%20Fevicon.svg" 
                                    alt="Swasthya Logo" 
                                    className="w-6 h-6 object-contain rounded-full bg-white p-0.5" 
                                />
                                      <h3 className="font-bold text-yellow-400 text-sm">Swasthya AI Assistant</h3>
                                  </div>
                                  <button onClick={() => setChatOpen(false)} className="text-teal-200 hover:text-white cursor-pointer"><Icon name="x" className="w-5 h-5" /></button>
                              </div>
                              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                                  {messages.map((msg, idx) => (
                                      <div key={idx} className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                                          <div className={`max-w-[90%] rounded-2xl p-3 text-xs shadow-sm ${msg.role === 'user' ? 'bg-teal-700 text-white' : 'bg-white border text-slate-700'}`}>
                                              {msg.role === 'user' ? msg.text : renderModelMessage(msg.text)}
                                          </div>
                                      </div>
                                  ))}
                                  {isAILoading && <div className="text-xs text-teal-800 font-bold animate-pulse italic">Swasthya AI is analyzing medical data...</div>}
                                  <div ref={chatEndRef} />
                              </div>

                              <form onSubmit={e => { e.preventDefault(); handleSendMessage(inputValue); }} className="p-3 bg-white border-t flex items-center space-x-2 rounded-b-2xl">
                                  <input type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} placeholder="Ask about tests or symptoms..." className="flex-1 p-2 bg-slate-50 border rounded-xl text-xs outline-none" />
                                  <button type="submit" className="bg-teal-900 hover:bg-teal-800 text-yellow-400 px-3.5 py-2 rounded-xl font-bold text-xs cursor-pointer shadow">Send</button>
                              </form>
                          </div>
                      )}
                  </div>
              </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
